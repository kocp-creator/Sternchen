<style>
/* Layout: Nachthimmel-Kopfzeile, darunter Karten auf ruhigem Grund, feste Tab-Leiste unten */
:root{
  --bg:#f2f3fb; --surface:#ffffff; --surface2:#e9ebf7; --ink:#1c2045; --muted:#62678c; --line:#dcdff0;
  --night:#1f2350; --night-ink:#f3f1ff; --gold:#e3a012; --gold-soft:#fdf1d3;
  --kid-a:#15897f; --kid-b:#d4466a;
  --pos:#21834b; --pos-soft:#dcf2e5; --neg:#c3394c; --neg-soft:#fbe1e5;
  --disp:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10122a; --surface:#1a1d3c; --surface2:#252950; --ink:#eceeff; --muted:#a2a6ca; --line:#2e3362;
    --night:#0b0d22; --night-ink:#f3f1ff; --gold:#f5c13f; --gold-soft:#3b331a;
    --kid-a:#3fc3b7; --kid-b:#f17391;
    --pos:#5fd08e; --pos-soft:#173a29; --neg:#f37888; --neg-soft:#45212b;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* Kopf */
.top{position:sticky;top:0;z-index:5;background:var(--night);color:var(--night-ink);
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px}
.top h1{margin:0;font:600 22px/1 var(--disp);letter-spacing:.2px}
.top svg{width:24px;height:24px;fill:var(--gold);flex:none}
.top .sub{margin-left:auto;font-size:13px;opacity:.75}

main{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto;display:grid;gap:18px}
h2{margin:0;font:600 19px/1.2 var(--disp)}
h3{margin:0;font:700 13px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Banner */
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 200px}

/* Kontokarten */
.kids{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kid{background:var(--surface);border-radius:18px;padding:14px;display:grid;gap:6px;border-top:5px solid var(--k);min-width:0;box-shadow:0 1px 0 var(--line)}
.kid-name{font:600 18px/1.2 var(--disp);color:var(--k);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kid-bal{display:flex;align-items:center;gap:6px}
.kid-bal .num{font:600 44px/1 var(--disp)}
.kid-bal svg{width:30px;height:30px;fill:var(--gold);flex:none}
.kid-today{font-size:13px;color:var(--muted)}
.kid-btns{display:grid;gap:6px;margin-top:4px}

/* Buttons */
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--surface2);min-height:44px}
.btn.primary{background:var(--night);color:var(--night-ink)}
@media (prefers-color-scheme:dark){.btn.primary{background:var(--gold);color:#1c1a10}}
.btn.kidbtn{background:color-mix(in srgb,var(--k) 14%,var(--surface));color:var(--k);font-size:14px;padding:8px 10px;min-height:40px}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* Liste */
.card{background:var(--surface);border-radius:18px;padding:14px;display:grid;gap:10px}
.list{display:grid}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--k);flex:none}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .txt span{font-size:13px;color:var(--muted)}
.amt{font:700 15px/1 var(--body);padding:6px 9px;border-radius:999px;background:var(--surface2);white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.up{background:var(--pos-soft);color:var(--pos)}
.amt.down{background:var(--neg-soft);color:var(--neg)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* Kalender */
.calhead{display:flex;align-items:center;gap:8px}
.calhead h2{flex:1;text-align:center}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface);display:grid;place-items:center;font-size:20px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wh{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cell{border:0;border-radius:10px;background:var(--surface);min-height:66px;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;min-width:0}
.cell.we{background:transparent;border:1px dashed var(--line)}
.cell.blank{visibility:hidden}
.cell.today{box-shadow:inset 0 0 0 2px var(--gold)}
.cell .dn{font-size:12px;font-weight:700;color:var(--muted);padding-left:3px}
.cv{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:800;border-radius:6px;padding:1px 3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.cv i{width:6px;height:6px;border-radius:50%;background:var(--k);flex:none}
.cv.std{color:var(--muted);font-weight:600}
.cv.up{background:var(--pos-soft);color:var(--pos)}
.cv.down{background:var(--neg-soft);color:var(--neg)}
.cv.off{color:var(--muted);font-weight:600;text-decoration:line-through}
.cv.flat{background:var(--surface2)}
.msum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msum div{background:var(--surface);border-radius:14px;padding:10px 12px;border-left:4px solid var(--k);font-size:14px}
.msum b{display:block;color:var(--k);font-family:var(--disp);font-weight:600;font-size:16px}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px;font-size:12px;font-weight:700;color:var(--muted);border-radius:12px;min-height:52px}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface2)}

/* Blatt (Bottom Sheet) & Dialog */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,12,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px;animation:up .2s ease-out}
.dialog{align-items:center;padding:16px}
.dialog .sheet{border-radius:20px;max-width:420px;animation:none}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.field{display:grid;gap:8px}
.field>label,.lbl{font-weight:700;font-size:14px}
input[type=text],input[type=date],input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:46px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:700;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--night);color:var(--night-ink);border-color:var(--night)}
@media (prefers-color-scheme:dark){.chip[aria-pressed="true"]{background:var(--gold);color:#1c1a10;border-color:var(--gold)}}
.chip.kidchip[aria-pressed="true"]{background:var(--k);border-color:var(--k);color:#fff}
.chip.sugg{font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:10px;font-weight:800;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.warn{margin:0;color:var(--neg);font-weight:700;font-size:14px}
.err{margin:0;color:var(--neg);font-weight:700;font-size:14px}
.actions{display:grid;grid-template-columns:1fr auto;gap:8px}
.sheethead{display:flex;align-items:center;gap:8px}
.sheethead h2{flex:1}

/* Tagesblatt */
.dk{background:var(--surface);border-radius:16px;padding:12px 14px;display:grid;gap:8px;border-left:5px solid var(--k)}
.dk header{display:flex;align-items:center;gap:8px;font:600 17px/1.2 var(--disp);color:var(--k)}
.dk header .amt{margin-left:auto}
.switchrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.switchrow span{flex:1}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch:checked{background:var(--pos)}
.switch:checked::after{left:23px}

/* Einstellungen */
.set{display:grid;gap:10px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:999px;padding:4px 4px 4px 12px;font-size:14px;font-weight:600}
.tag button{border:0;background:none;width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--muted)}
.inline{display:flex;gap:8px}
.kidedit{display:grid;gap:10px;padding:12px;border-radius:14px;border-left:5px solid var(--k);background:var(--bg)}
.kidedit label[for^="kn-"]{color:var(--k)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line);padding:0;position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.sw.custom{display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--muted);cursor:pointer;
  background:conic-gradient(from 0deg,#e5484d,#f5a524,#46a758,#0090ff,#8e4ec6,#e5484d)}
.sw.custom[style*="#"]{background:var(--c);color:#fff;box-shadow:0 0 0 3px var(--ink)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.inline input{flex:1;min-width:0}

/* Ersteinrichtung */
.setup{max-width:520px;margin:0 auto;display:grid;gap:16px}
.setup .kidset{background:var(--surface);border-radius:16px;padding:14px;display:grid;gap:10px;border-left:5px solid var(--k)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.intro{font-size:15px;margin:0}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);color:var(--night-ink);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<header class="top">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
  <h1>Sternchenkonto</h1>
  <span class="sub" id="todaylbl"></span>
</header>

<main id="app"></main>

<nav class="tabs" id="tabs" hidden>
  <button data-view="home" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.5 6 .7-4.4 4.1 1.2 6L12 16.4l-5.4 2.9 1.2-6L3.4 9.2l6-.7z"/></svg>Übersicht</button>
  <button data-view="cal">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Kalender</button>
  <button data-view="set">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Einstellungen</button>
</nav>

<input type="file" id="importfile" accept="application/json,.json" hidden>
<div id="layer"></div>
<div id="dlglayer"></div>

<script>
'use strict';
const APP_VERSION = '1.1.0';
const KEY = 'sternchen-v1'; // Speicherschlüssel der Daten, unabhängig von der App-Version
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
const PRICES = [5,10,15,20,25,30,35,40,45,50];
const ADJ = [2,1,-1,-2]; // in halben Sternen

/* ---------- Hilfsfunktionen ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const today = () => iso(new Date());
const addDays = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return iso(d); };
const isWd = s => { const g = pd(s).getDay(); return g > 0 && g < 6; };
const fmt = h => { const v = h/2; return Number.isInteger(v) ? String(v) : v.toFixed(1).replace('.',','); };
const sfmt = h => (h > 0 ? '+' : h < 0 ? '−' : '±') + fmt(Math.abs(h));
const dlong = s => pd(s).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const dshort = s => pd(s).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'2-digit'});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const quarter = s => { const d = pd(s); return d.getFullYear()*4 + Math.floor(d.getMonth()/3); };
const cls = h => h > 0 ? 'up' : h < 0 ? 'down' : '';
const num = v => { const t = String(v ?? '').trim().replace('−','-').replace(',','.'); return t === '' ? 0 : Number(t); };
const $ = sel => document.querySelector(sel);

/* ---------- Daten ---------- */
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Speichern fehlgeschlagen. Bitte Sicherung erstellen.'); }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

const kid = id => S.kids.find(k => k.id === id);
const COLORS = [
  ['#15897f','Türkis'], ['#d4466a','Beere'], ['#2f6fd6','Blau'], ['#7b4fd0','Lila'], ['#d9701c','Orange'],
  ['#3f8f2e','Grün'], ['#c9372c','Rot'], ['#c2409c','Pink'], ['#1f7a99','Petrol'], ['#8a5a2b','Braun']];
const kcol = id => { const k = S && S.kids.find(x => x.id === id); return (k && k.color) || (id === 'a' ? 'var(--kid-a)' : 'var(--kid-b)'); };
const isExcluded = (date,k) => S.excluded.includes(date+'|'+k);
const stdEligible = date => isWd(date) && date > S.startDate;
const stdOn = (date,k) => stdEligible(date) && date <= today() && !isExcluded(date,k);
const entriesOn = (date,k) => S.entries.filter(e => e.date === date && (!k || e.kid === k))
  .sort((a,b) => (a.type==='start'?-1:0)-(b.type==='start'?-1:0) || a.created-b.created);

function dayTotal(date,k) {
  return (stdOn(date,k) ? 2 : 0) + entriesOn(date,k).reduce((s,e) => s + e.amount, 0);
}
function balance(k, upTo) {
  const end = upTo || today();
  let sum = S.entries.reduce((s,e) => e.kid === k && e.date <= end ? s + e.amount : s, 0);
  let d = addDays(S.startDate,1);
  while (d <= end && d <= today()) { if (stdOn(d,k)) sum += 2; d = addDays(d,1); }
  return sum;
}
function backupDue() {
  const ref = S.lastBackup || S.created;
  return quarter(ref) < quarter(today());
}

/* ---------- Ansicht ---------- */
let view = 'home';
let calY, calM;
{ const n = new Date(); calY = n.getFullYear(); calM = n.getMonth(); }

function render() {
  $('#todaylbl').textContent = new Date().toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
  if (!S) { $('#tabs').hidden = true; renderSetup(); return; }
  $('#tabs').hidden = false;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'));
  if (view === 'home') renderHome();
  else if (view === 'cal') renderCal();
  else renderSet();
}

function bannerHTML() {
  if (!backupDue()) return '';
  return `<div class="banner"><p><b>Quartalssicherung fällig.</b> Die Daten liegen nur auf diesem Handy. Speichere jetzt eine Sicherungsdatei.</p>
    <button class="btn primary" data-act="backup">Jetzt sichern</button></div>`;
}

/* Ersteinrichtung */
function renderSetup() {
  const t = today();
  $('#app').innerHTML = `
  <form class="setup" id="setupform" novalidate>
    <h2>Willkommen</h2>
    <p class="intro">Trag die Namen deiner Kinder und ihren aktuellen Sternchenstand ein. Ab dem nächsten Wochentag bucht die App automatisch jeden Tag +1 Stern.</p>
    ${['a','b'].map((id,i) => `
    <div class="kidset" style="--k:${kcol(id)}">
      <div class="field"><label for="n-${id}">Name Kind ${i+1}</label><input type="text" id="n-${id}" autocomplete="off" required></div>
      <div class="field"><label for="b-${id}">Aktueller Stand (Sterne)</label><input type="text" id="b-${id}" inputmode="decimal" autocomplete="off" value="0"></div>
    </div>`).join('')}
    <div class="field"><label for="s-date">Stand vom</label><input type="date" id="s-date" value="${t}" max="${t}">
      <span class="small muted">Das Sternchen dieses Tages sollte im Stand schon enthalten sein.</span></div>
    <p class="err" id="s-err" hidden></p>
    <button class="btn primary wide" type="submit">Konten anlegen</button>
  </form>`;
  $('#setupform').addEventListener('submit', ev => {
    ev.preventDefault();
    const na = $('#n-a').value.trim(), nb = $('#n-b').value.trim();
    const ba = num($('#b-a').value), bb = num($('#b-b').value);
    const sd = $('#s-date').value || t;
    const err = $('#s-err');
    if (!na || !nb) { err.textContent = 'Bitte beide Namen eintragen.'; err.hidden = false; return; }
    if (isNaN(ba) || isNaN(bb) || (ba*2) % 1 || (bb*2) % 1) { err.textContent = 'Stände bitte in ganzen oder halben Sternen eingeben, z. B. 12 oder 12,5.'; err.hidden = false; return; }
    const now = Date.now();
    S = { v:1, created:t, startDate:sd, lastBackup:null,
      kids:[{id:'a',name:na},{id:'b',name:nb}],
      entries:[
        {id:uid(),date:sd,kid:'a',amount:Math.round(ba*2),type:'start',reason:'Startstand',created:now},
        {id:uid(),date:sd,kid:'b',amount:Math.round(bb*2),type:'start',reason:'Startstand',created:now+1}],
      excluded:[], hidden:[],
      rewards:['Schwimmbad','Freizeitpark','Ausflug'] };
    save(); view = 'home'; render(); toast('Konten angelegt');
  });
}

/* Übersicht */
function renderHome() {
  const t = today();
  const recent = [...S.entries].sort((a,b) => b.date.localeCompare(a.date) || b.created - a.created).slice(0,10);
  const todayLine = k => {
    if (!isWd(t)) return 'Heute ist Wochenende';
    if (t <= S.startDate) return 'Heute im Startstand';
    const d = dayTotal(t,k);
    return 'Heute: ' + sfmt(d);
  };
  $('#app').innerHTML = `
  ${bannerHTML()}
  <section class="kids">
    ${S.kids.map(k => `
    <div class="kid" style="--k:${kcol(k.id)}">
      <div class="kid-name">${esc(k.name)}</div>
      <div class="kid-bal"><span class="num">${fmt(balance(k.id))}</span>${STAR}</div>
      <div class="kid-today">${todayLine(k.id)}</div>
      <div class="kid-btns">
        <button class="btn kidbtn" data-act="add" data-kid="${k.id}" data-mode="adjust">Verhalten</button>
        <button class="btn kidbtn" data-act="add" data-kid="${k.id}" data-mode="redeem">Einlösen</button>
      </div>
    </div>`).join('')}
  </section>
  <section class="card">
    <h3>Letzte Buchungen</h3>
    <div class="list">${recent.length ? recent.map(rowHTML).join('') : '<p class="empty">Noch keine Buchungen.</p>'}</div>
    <p class="small muted" style="margin:0">Das tägliche +1 bucht die App von Montag bis Freitag selbst. Es steht im Kalender.</p>
  </section>`;
}
function rowHTML(e) {
  const k = kid(e.kid);
  const label = e.type === 'redeem' ? 'Einlösung' : e.type === 'start' ? 'Startstand' : 'Verhalten';
  return `<button class="row" data-act="edit" data-id="${e.id}" style="--k:${kcol(e.kid)}">
    <span class="dot"></span>
    <span class="txt"><b>${esc(e.reason || label)}</b><span>${esc(k ? k.name : '')} · ${dshort(e.date)} · ${label}</span></span>
    <span class="amt ${cls(e.amount)}">${sfmt(e.amount)}</span></button>`;
}

/* Kalender */
function renderCal() {
  const first = new Date(calY, calM, 1);
  const days = new Date(calY, calM+1, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const t = today();
  const title = first.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<span class="cell blank"></span>';
  const sums = {a:{earn:0,spend:0}, b:{earn:0,spend:0}};
  for (let d = 1; d <= days; d++) {
    const ds = iso(new Date(calY, calM, d));
    const we = !isWd(ds);
    let lines = '';
    for (const k of S.kids) {
      const es = entriesOn(ds,k.id);
      const on = stdOn(ds,k.id);
      const tot = dayTotal(ds,k.id);
      es.forEach(e => { if (e.type === 'redeem') sums[k.id].spend -= e.amount; else if (e.type !== 'start') { if (e.amount > 0) sums[k.id].earn += e.amount; } });
      if (on) sums[k.id].earn += 2;
      let c = null, txt = '';
      if (es.length) { const net = es.reduce((s,e)=>s+e.amount,0); c = net > 0 ? 'up' : net < 0 ? 'down' : 'flat'; txt = es.some(e=>e.type==='start') ? fmt(tot) : sfmt(tot); }
      else if (on) { c = 'std'; txt = '+1'; }
      else if (stdEligible(ds) && isExcluded(ds,k.id)) { c = 'off'; txt = '+1'; }
      if (c) lines += `<span class="cv ${c}" style="--k:${kcol(k.id)}"><i></i>${txt}</span>`;
    }
    cells += `<button class="cell ${we?'we':''} ${ds===t?'today':''}" data-act="day" data-date="${ds}" aria-label="${dlong(ds)}"><span class="dn">${d}</span>${lines}</button>`;
  }
  $('#app').innerHTML = `
  ${bannerHTML()}
  <div class="calhead">
    <button class="iconbtn" data-act="mon" data-d="-1" aria-label="Vorheriger Monat">‹</button>
    <h2>${title}</h2>
    <button class="iconbtn" data-act="mon" data-d="1" aria-label="Nächster Monat">›</button>
  </div>
  <div class="legend">${S.kids.map(k=>`<span style="--k:${kcol(k.id)}"><span class="dot"></span>${esc(k.name)}</span>`).join('')}<span>Grau: normales +1</span></div>
  <div class="grid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<span class="wh">${w}</span>`).join('')}${cells}</div>
  <div class="msum">${S.kids.map(k=>`<div style="--k:${kcol(k.id)}"><b>${esc(k.name)}</b>Verdient ${fmt(sums[k.id].earn)} · Eingelöst ${fmt(sums[k.id].spend)}</div>`).join('')}</div>
  <p class="small muted" style="margin:0">Tippe auf einen Tag, um Buchungen zu sehen, hinzuzufügen oder den Tag auszunehmen (z. B. Feiertag, Ferien, krank).</p>`;
}

function openDay(ds) {
  const t = today();
  const body = S.kids.map(k => {
    const es = entriesOn(ds,k.id);
    let sw = '';
    if (stdEligible(ds)) {
      const future = ds > t;
      sw = `<label class="switchrow"><span>Standard-Sternchen +1${future ? '<br><span class="small muted">wird am Tag selbst gebucht</span>' : ''}</span>
        <input type="checkbox" class="switch" data-act="std" data-kid="${k.id}" data-date="${ds}" ${isExcluded(ds,k.id)?'':'checked'} aria-label="Standard-Sternchen für ${esc(k.name)}"></label>`;
    } else if (isWd(ds) && ds <= S.startDate) {
      sw = '<p class="small muted" style="margin:0">Dieser Tag ist im Startstand enthalten.</p>';
    } else {
      sw = '<p class="small muted" style="margin:0">Wochenende, kein Standard-Sternchen.</p>';
    }
    return `<section class="dk" style="--k:${kcol(k.id)}">
      <header>${esc(k.name)}<span class="amt ${cls(dayTotal(ds,k.id))}">${sfmt(dayTotal(ds,k.id))}</span></header>
      ${sw}
      ${es.length ? `<div class="list">${es.map(rowHTML).join('')}</div>` : ''}
      <button class="btn kidbtn" data-act="add" data-kid="${k.id}" data-date="${ds}">+ Buchung für ${esc(k.name)}</button>
    </section>`;
  }).join('');
  showSheet(`<div class="sheethead"><h2>${dlong(ds)}</h2><button class="iconbtn" data-act="close" aria-label="Schließen">✕</button></div>${body}`, 'day', ds);
}

/* Buchung anlegen / bearbeiten */
let E = null;
function suggestions(mode) {
  const type = mode === 'redeem' ? 'redeem' : 'adjust';
  const cnt = new Map();
  S.entries.forEach(e => { if (e.type === type && e.reason) cnt.set(e.reason, (cnt.get(e.reason)||0) + 1); });
  let list = [...cnt.keys()].filter(r => !S.hidden.includes(r)).sort((a,b) => cnt.get(b)-cnt.get(a) || a.localeCompare(b,'de'));
  if (type === 'redeem') list = [...S.rewards, ...list.filter(r => !S.rewards.includes(r))];
  return list;
}
function lastPrice(reason) {
  const e = [...S.entries].filter(x => x.type === 'redeem' && x.reason === reason).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created)[0];
  return e ? -e.amount/2 : null;
}
function openEntry(o) {
  if (o.id) {
    const e = S.entries.find(x => x.id === o.id);
    if (!e) return;
    E = { id:e.id, type:e.type, date:e.date, kids:new Set([e.kid]), mode:e.type==='redeem'?'redeem':'adjust',
          amount:e.type==='redeem'?2:e.amount, price:e.type==='redeem'?-e.amount/2:null, reason:e.reason||'' };
  } else {
    E = { id:null, type:null, date:o.date || today(), kids:new Set([o.kid || 'a']), mode:o.mode || 'adjust', amount:2, price:null, reason:'' };
  }
  const isStart = E.type === 'start';
  const custom = E.mode === 'adjust' && !ADJ.includes(E.amount);
  showSheet(`
    <div class="sheethead"><h2>${E.id ? (isStart ? 'Startstand bearbeiten' : 'Buchung bearbeiten') : 'Neue Buchung'}</h2>
      <button class="iconbtn" data-act="close" aria-label="Schließen">✕</button></div>
    <div class="field"><span class="lbl">${E.id ? 'Kind' : 'Kind (beide möglich)'}</span>
      <div class="chips" id="e-kids">${S.kids.map(k=>`<button type="button" class="chip kidchip" data-kid="${k.id}" style="--k:${kcol(k.id)}">${esc(k.name)}</button>`).join('')}</div></div>
    ${isStart ? '' : `<div class="seg" id="e-mode"><button type="button" data-m="adjust">Verhalten</button><button type="button" data-m="redeem">Einlösen</button></div>`}
    <div class="field" id="e-adjust"><span class="lbl">${isStart ? 'Stand (Sterne)' : 'Sterne'}</span>
      ${isStart ? '' : `<div class="chips" id="e-amts">${ADJ.map(a=>`<button type="button" class="chip" data-a="${a}">${sfmt(a)}</button>`).join('')}</div>`}
      <input type="text" id="e-custom" inputmode="decimal" autocomplete="off" placeholder="Anderer Wert, z. B. 2 oder −1,5" value="${isStart || custom ? E.amount/2 : ''}">
    </div>
    <div class="field" id="e-redeem"><span class="lbl">Kosten</span>
      <div class="chips" id="e-prices">${PRICES.map(p=>`<button type="button" class="chip" data-p="${p}">${p}</button>`).join('')}</div></div>
    ${isStart ? '' : `<div class="field"><label for="e-reason" id="e-rlabel">Grund</label>
      <input type="text" id="e-reason" autocomplete="off" value="${esc(E.reason)}" placeholder="Tippen oder unten auswählen">
      <div class="chips" id="e-sugg"></div></div>`}
    <div class="field"><label for="e-date">Datum</label><input type="date" id="e-date" value="${E.date}"></div>
    <p class="warn" id="e-warn" hidden></p>
    <p class="err" id="e-err" hidden></p>
    <div class="actions"><button class="btn primary" id="e-save" type="button">Speichern</button>
      ${E.id && !isStart ? '<button class="btn danger" id="e-del" type="button">Löschen</button>' : '<button class="btn ghost" data-act="close" type="button">Abbrechen</button>'}</div>
  `, 'entry');

  const sheet = $('#layer .sheet');
  sheet.querySelector('#e-kids').addEventListener('click', ev => {
    const b = ev.target.closest('[data-kid]'); if (!b) return;
    const k = b.dataset.kid;
    if (E.id) E.kids = new Set([k]);
    else if (E.kids.has(k)) { if (E.kids.size > 1) E.kids.delete(k); } else E.kids.add(k);
    upd();
  });
  sheet.querySelector('#e-mode')?.addEventListener('click', ev => {
    const b = ev.target.closest('[data-m]'); if (!b || b.dataset.m === E.mode) return;
    E.mode = b.dataset.m; E.reason = ''; sheet.querySelector('#e-reason').value = ''; upd();
  });
  sheet.querySelector('#e-amts')?.addEventListener('click', ev => {
    const b = ev.target.closest('[data-a]'); if (!b) return;
    E.amount = +b.dataset.a; sheet.querySelector('#e-custom').value = ''; upd();
  });
  sheet.querySelector('#e-custom').addEventListener('input', ev => {
    const v = num(ev.target.value);
    if (!isNaN(v) && ev.target.value.trim() !== '') E.amount = Math.round(v*2);
    upd();
  });
  sheet.querySelector('#e-prices').addEventListener('click', ev => {
    const b = ev.target.closest('[data-p]'); if (!b) return;
    E.price = +b.dataset.p; upd();
  });
  const rin = sheet.querySelector('#e-reason');
  rin?.addEventListener('input', () => { E.reason = rin.value; updSugg(); updWarn(); });
  sheet.querySelector('#e-sugg')?.addEventListener('click', ev => {
    const b = ev.target.closest('[data-r]'); if (!b) return;
    E.reason = b.dataset.r; rin.value = E.reason;
    if (E.mode === 'redeem') { const lp = lastPrice(E.reason); if (lp && !E.price) E.price = lp; }
    upd();
  });
  sheet.querySelector('#e-date').addEventListener('change', ev => { E.date = ev.target.value; updWarn(); });
  sheet.querySelector('#e-save').addEventListener('click', saveEntry);
  sheet.querySelector('#e-del')?.addEventListener('click', () => {
    confirmBox('Diese Buchung löschen?', 'Löschen', () => {
      S.entries = S.entries.filter(x => x.id !== E.id); save(); closeSheet(); render(); toast('Buchung gelöscht');
    });
  });
  upd();
}
function upd() {
  const sh = $('#layer .sheet'); if (!sh) return;
  sh.querySelectorAll('#e-kids [data-kid]').forEach(b => b.setAttribute('aria-pressed', E.kids.has(b.dataset.kid)));
  sh.querySelectorAll('#e-mode [data-m]').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === E.mode));
  const custom = sh.querySelector('#e-custom').value !== '';
  sh.querySelectorAll('#e-amts [data-a]').forEach(b => b.setAttribute('aria-pressed', !custom && +b.dataset.a === E.amount));
  sh.querySelectorAll('#e-prices [data-p]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.p === E.price));
  sh.querySelector('#e-adjust').hidden = E.mode !== 'adjust';
  sh.querySelector('#e-redeem').hidden = E.mode !== 'redeem';
  const rl = sh.querySelector('#e-rlabel'); if (rl) rl.textContent = E.mode === 'redeem' ? 'Wofür?' : 'Grund';
  updSugg(); updWarn();
}
function updSugg() {
  const box = $('#e-sugg'); if (!box) return;
  const q = (E.reason || '').trim().toLowerCase();
  let list = suggestions(E.mode);
  if (q) list = list.filter(r => r.toLowerCase().includes(q));
  list = list.slice(0, 14);
  box.innerHTML = list.map(r => `<button type="button" class="chip sugg" data-r="${esc(r)}" aria-pressed="${r === E.reason}">${esc(r)}</button>`).join('')
    || (q ? '<span class="small muted">Neuer Grund. Er steht künftig zur Auswahl.</span>' : '<span class="small muted">Noch keine früheren Gründe.</span>');
}
function amountNow() { return E.mode === 'redeem' ? (E.price ? -E.price*2 : 0) : E.amount; }
function updWarn() {
  const w = $('#e-warn'); if (!w) return;
  const a = amountNow();
  const msgs = [];
  if (a < 0) for (const k of E.kids) {
    let b = balance(k);
    if (E.id) { const old = S.entries.find(x => x.id === E.id); if (old && old.date <= today()) b -= old.amount; }
    if (E.date <= today() && b + a < 0) msgs.push(`${kid(k).name} hätte danach ${sfmt(b+a)} Sterne.`);
  }
  w.textContent = msgs.length ? 'Achtung: ' + msgs.join(' ') : '';
  w.hidden = !msgs.length;
}
function saveEntry() {
  const err = $('#e-err');
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (!E.date) return fail('Bitte ein Datum wählen.');
  const a = amountNow();
  const isStart = E.type === 'start';
  if (E.mode === 'redeem' && !E.price) return fail('Bitte die Kosten wählen.');
  if (E.mode === 'adjust' && !isStart && (!a || isNaN(a))) return fail('Bitte einen Wert wählen.');
  const reason = isStart ? 'Startstand' : (E.reason || '').trim();
  if (!reason) return fail(E.mode === 'redeem' ? 'Bitte eintragen, wofür eingelöst wird.' : 'Bitte einen Grund eintragen.');
  const type = isStart ? 'start' : E.mode === 'redeem' ? 'redeem' : 'adjust';
  if (E.id) {
    const e = S.entries.find(x => x.id === E.id);
    Object.assign(e, { date:E.date, kid:[...E.kids][0], amount:a, type, reason, edited:Date.now() });
  } else {
    let n = Date.now();
    for (const k of E.kids) S.entries.push({ id:uid(), date:E.date, kid:k, amount:a, type, reason, created:n++ });
  }
  S.hidden = S.hidden.filter(r => r !== reason);
  save(); closeSheet(); render(); toast('Gespeichert');
}

/* Einstellungen */
function renderSet() {
  const reasons = new Map();
  S.entries.forEach(e => { if ((e.type === 'adjust' || e.type === 'redeem') && e.reason && !S.rewards.includes(e.reason)) reasons.set(e.reason, (reasons.get(e.reason)||0)+1); });
  const shown = [...reasons.keys()].filter(r => !S.hidden.includes(r)).sort((a,b)=>a.localeCompare(b,'de'));
  $('#app').innerHTML = `
  ${bannerHTML()}
  <section class="card set">
    <h3>Sicherung</h3>
    <p style="margin:0">Die Daten liegen nur auf diesem Handy. Speichere die Sicherungsdatei am besten zusätzlich in Google Drive oder schick sie dir per Mail.</p>
    <p class="small muted" style="margin:0">Letzte Sicherung: ${S.lastBackup ? dlong(S.lastBackup) : 'noch keine'}. Erinnerung: jedes Quartal.</p>
    <button class="btn primary wide" data-act="backup">Sicherung speichern (JSON)</button>
    <button class="btn wide" data-act="csv">Als Tabelle exportieren (CSV)</button>
    <button class="btn wide" data-act="import">Sicherung laden</button>
  </section>
  <section class="card set">
    <h3>Kinder</h3>
    ${S.kids.map(k=>`<div class="kidedit" style="--k:${kcol(k.id)}">
      <div class="field"><label for="kn-${k.id}">Name</label><input type="text" id="kn-${k.id}" data-kname="${k.id}" value="${esc(k.name)}"></div>
      <div class="field"><span class="lbl">Farbe</span>
        <div class="swatches">${COLORS.map(([c,n])=>`<button type="button" class="sw" data-act="color" data-kid="${k.id}" data-c="${c}" style="--c:${c}" aria-label="${n}" aria-pressed="${(k.color||'').toLowerCase()===c}"></button>`).join('')}
          <label class="sw custom" style="--c:${k.color && !COLORS.some(x=>x[0]===k.color.toLowerCase()) ? k.color : 'transparent'}" aria-label="Eigene Farbe">
            <input type="color" id="kc-${k.id}" data-kcolor="${k.id}" value="${/^#[0-9a-f]{6}$/i.test(k.color||'') ? k.color : '#15897f'}">+</label>
        </div></div>
    </div>`).join('')}
  </section>
  <section class="card set">
    <h3>Belohnungen</h3>
    <div class="tagrow">${S.rewards.map((r,i)=>`<span class="tag">${esc(r)}<button data-act="delreward" data-i="${i}" aria-label="${esc(r)} entfernen">✕</button></span>`).join('') || '<span class="empty">Keine Belohnungen.</span>'}</div>
    <div class="inline"><input type="text" id="newreward" placeholder="Neue Belohnung, z. B. Kino" aria-label="Neue Belohnung"><button class="btn" data-act="addreward">Hinzufügen</button></div>
    <p class="small muted" style="margin:0">Den Preis wählst du beim Einlösen. Die App merkt sich den zuletzt verwendeten Preis.</p>
  </section>
  <section class="card set">
    <h3>Gespeicherte Gründe</h3>
    <div class="tagrow">${shown.map(r=>`<span class="tag">${esc(r)}<button data-act="hide" data-r="${esc(r)}" aria-label="${esc(r)} ausblenden">✕</button></span>`).join('') || '<span class="empty">Noch keine Gründe. Sie entstehen beim Buchen.</span>'}</div>
    ${S.hidden.length ? `<button class="btn ghost" data-act="unhide">${S.hidden.length} ausgeblendete wieder anzeigen</button>` : ''}
    <p class="small muted" style="margin:0">✕ blendet einen Grund in den Vorschlägen aus. Bestehende Buchungen bleiben unverändert.</p>
  </section>
  <section class="card set">
    <h3>Zurücksetzen</h3>
    <p class="small muted" style="margin:0">Konten seit ${dlong(S.startDate)}.</p>
    <button class="btn danger wide" data-act="reset">Alle Daten löschen</button>
  </section>
  <p class="small muted" style="margin:0;text-align:center">Sternchenkonto · Version ${APP_VERSION}</p>`;
}

/* Export / Import */
function download(name, text, type) {
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function doBackup() {
  const data = JSON.stringify({...S, appVersion:APP_VERSION, exportedAt:new Date().toISOString()}, null, 1);
  download(`sternchen-sicherung-${today()}.json`, data, 'application/json');
  S.lastBackup = today(); save(); render(); toast('Sicherung gespeichert (Ordner Downloads)');
}
function doCSV() {
  const rows = [];
  for (const k of S.kids) {
    const ev = S.entries.filter(e => e.kid === k.id).map(e => ({date:e.date, amount:e.amount, type:e.type, reason:e.reason, ord:e.type==='start'?0:2, c:e.created}));
    let d = addDays(S.startDate,1);
    while (d <= today()) { if (stdOn(d,k.id)) ev.push({date:d, amount:2, type:'std', reason:'Tagesstern', ord:1, c:0}); d = addDays(d,1); }
    ev.sort((a,b) => a.date.localeCompare(b.date) || a.ord-b.ord || a.c-b.c);
    let run = 0;
    ev.forEach(e => { run += e.amount; rows.push({...e, kid:k.name, bal:run}); });
  }
  rows.sort((a,b) => a.date.localeCompare(b.date) || a.kid.localeCompare(b.kid) || a.ord-b.ord || a.c-b.c);
  const art = {start:'Startstand', std:'Standard', adjust:'Verhalten', redeem:'Einlösung'};
  const q = s => '"' + String(s).replace(/"/g,'""') + '"';
  const n2 = h => (h/2).toString().replace('.',',');
  const lines = ['Datum;Wochentag;Kind;Änderung;Art;Grund;Kontostand'];
  rows.forEach(r => lines.push([pd(r.date).toLocaleDateString('de-DE'), pd(r.date).toLocaleDateString('de-DE',{weekday:'short'}), q(r.kid), n2(r.amount), art[r.type], q(r.reason||''), n2(r.bal)].join(';')));
  download(`sternchen-${today()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
  toast('Tabelle gespeichert (Ordner Downloads)');
}
$('#importfile').addEventListener('change', ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); } catch (e) { return toast('Die Datei ist keine gültige Sicherung.'); }
    if (!d || !Array.isArray(d.kids) || !Array.isArray(d.entries) || !d.startDate) return toast('Die Datei ist keine Sternchen-Sicherung.');
    confirmBox(`Sicherung vom ${d.exportedAt ? new Date(d.exportedAt).toLocaleDateString('de-DE') : 'unbekanntem Datum'} laden? Die aktuellen Daten werden ersetzt.`, 'Laden', () => {
      delete d.exportedAt; delete d.appVersion;
      S = Object.assign({excluded:[], hidden:[], rewards:[], lastBackup:null, created:today()}, d);
      save(); view = 'home'; render(); toast('Sicherung geladen');
    });
  };
  r.readAsText(f);
});

/* Blatt, Dialog, Toast */
let sheetCtx = null;
function showSheet(html, ctx, arg) {
  sheetCtx = {ctx, arg};
  $('#layer').innerHTML = `<div class="overlay" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
}
function closeSheet() { $('#layer').innerHTML = ''; sheetCtx = null; }
function refreshSheet() { if (sheetCtx && sheetCtx.ctx === 'day') openDay(sheetCtx.arg); }
function confirmBox(text, ok, cb) {
  $('#dlglayer').innerHTML = `<div class="overlay dialog" data-act="dlgclose"><div class="sheet" role="alertdialog" aria-modal="true">
    <p style="margin:0;font-weight:700">${esc(text)}</p>
    <div class="actions"><button class="btn danger" id="dlg-ok">${esc(ok)}</button><button class="btn" id="dlg-no">Abbrechen</button></div></div></div>`;
  $('#dlg-ok').onclick = () => { $('#dlglayer').innerHTML = ''; cb(); };
  $('#dlg-no').onclick = () => { $('#dlglayer').innerHTML = ''; };
  $('#dlg-ok').focus();
}
let toastT;
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}

function setColor(id, c) {
  const k = kid(id); if (!k) return;
  k.color = c.toLowerCase(); save(); render(); toast('Farbe gespeichert');
}

/* Ereignisse */
document.addEventListener('click', ev => {
  const tab = ev.target.closest('#tabs [data-view]');
  if (tab) { view = tab.dataset.view; render(); window.scrollTo(0,0); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'backdrop' && ev.target !== el) return;
  if (act === 'dlgclose' && ev.target !== el) return;
  switch (act) {
    case 'add': openEntry({kid:el.dataset.kid, mode:el.dataset.mode, date:el.dataset.date}); break;
    case 'edit': openEntry({id:el.dataset.id}); break;
    case 'day': openDay(el.dataset.date); break;
    case 'mon': calM += +el.dataset.d; if (calM < 0) { calM = 11; calY--; } if (calM > 11) { calM = 0; calY++; } render(); break;
    case 'close': case 'backdrop': closeSheet(); break;
    case 'dlgclose': $('#dlglayer').innerHTML = ''; break;
    case 'backup': doBackup(); break;
    case 'csv': doCSV(); break;
    case 'import': $('#importfile').click(); break;
    case 'addreward': {
      const v = $('#newreward').value.trim();
      if (v && !S.rewards.includes(v)) { S.rewards.push(v); save(); render(); toast('Belohnung hinzugefügt'); }
      break; }
    case 'delreward': S.rewards.splice(+el.dataset.i, 1); save(); render(); break;
    case 'color': setColor(el.dataset.kid, el.dataset.c); break;
    case 'hide': S.hidden.push(el.dataset.r); save(); render(); break;
    case 'unhide': S.hidden = []; save(); render(); break;
    case 'reset': confirmBox('Wirklich alle Daten löschen? Das lässt sich ohne Sicherung nicht rückgängig machen.', 'Alles löschen', () => {
        S = null; try { localStorage.removeItem(KEY); } catch (e) {} view = 'home'; render(); });
      break;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.act === 'std') {
    const key = t.dataset.date + '|' + t.dataset.kid;
    if (t.checked) S.excluded = S.excluded.filter(x => x !== key); else if (!S.excluded.includes(key)) S.excluded.push(key);
    save(); render(); refreshSheet();
  }
  if (t.dataset.kcolor) { setColor(t.dataset.kcolor, t.value); return; }
  if (t.dataset.kname) {
    const k = kid(t.dataset.kname); const v = t.value.trim();
    if (k && v) { k.name = v; save(); toast('Name gespeichert'); } else t.value = k.name;
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#dlglayer').innerHTML) $('#dlglayer').innerHTML = ''; else closeSheet(); }
  if (ev.key === 'Enter' && ev.target.id === 'newreward') $('[data-act="addreward"]').click();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheetCtx) render(); });

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
